/*
  Reproduction fonctionnelle du backend PHP/MySQL original (index.php,
  dashboard.php, request-leave.php, my-requests.php, admin-dashboard.php,
  manage-users.php) en React, persistée en localStorage pour fonctionner
  en statique sur Vercel, sans serveur PHP ni base MySQL réelle.

  Schéma repris de database.sql :
    utilisateurs(id, nom, prenom, email, password, role, solde_conges)
    types_conges(id, nom, couleur)
    demandes_conges(id, utilisateur_id, type_conge_id, date_debut, date_fin,
                     duree, motif, statut, commentaire, date_demande)
*/

const TYPES_CONGES = [
  { id: 1, nom: "Congés payés", couleur: "#4361ee" },
  { id: 2, nom: "RTT", couleur: "#3498db" },
  { id: 3, nom: "Maladie", couleur: "#e74c3c" },
  { id: 4, nom: "Congé sans solde", couleur: "#f39c12" },
  { id: 5, nom: "Congé exceptionnel", couleur: "#9d4edd" },
];

const SOLDE_INITIAL = 25; // valeur par défaut reprise de database.sql (solde_conges DEFAULT 25)

const SEED_USERS = [
  { id: 1, nom: "Admin", prenom: "Super", email: "admin@example.com", role: "admin", solde_conges: 30 },
  { id: 2, nom: "Bopda", prenom: "Nick", email: "nick@example.com", role: "employe", solde_conges: 18 },
  { id: 3, nom: "Klein", prenom: "Sarah", email: "sarah@example.com", role: "employe", solde_conges: 4 },
];

const SEED_DEMANDES = [
  { id: 1, utilisateur_id: 2, type_conge_id: 2, date_debut: "2026-10-02", date_fin: "2026-10-02", duree: 1, motif: "", statut: "en_attente", commentaire: "", date_demande: "2026-09-10" },
  { id: 2, utilisateur_id: 2, type_conge_id: 1, date_debut: "2026-08-11", date_fin: "2026-08-15", duree: 5, motif: "Vacances d'été", statut: "approuvé", commentaire: "", date_demande: "2026-07-20" },
  { id: 3, utilisateur_id: 3, type_conge_id: 1, date_debut: "2026-09-01", date_fin: "2026-09-03", duree: 3, motif: "", statut: "en_attente", commentaire: "", date_demande: "2026-08-25" },
];

function loadDB() {
  const raw = localStorage.getItem("conges_react_db");
  if (raw) return JSON.parse(raw);
  const seed = { users: SEED_USERS, demandes: SEED_DEMANDES };
  localStorage.setItem("conges_react_db", JSON.stringify(seed));
  return seed;
}

function saveDB(db) {
  localStorage.setItem("conges_react_db", JSON.stringify(db));
}

// Reproduit le calcul PHP : $debut->diff($fin)->days + 1
function calculerDuree(dateDebut, dateFin) {
  const d1 = new Date(dateDebut);
  const d2 = new Date(dateFin);
  const diffTime = d2 - d1;
  const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
  return diffDays + 1;
}

function typeNom(id) {
  return TYPES_CONGES.find((t) => t.id === id)?.nom || "?";
}

function StatutBadge({ statut }) {
  const map = {
    en_attente: ["bg-amber-100 text-amber-800", "En attente"],
    "approuvé": ["bg-emerald-100 text-emerald-800", "Approuvé"],
    "refusé": ["bg-rose-100 text-rose-800", "Refusé"],
    "annulé": ["bg-stone-200 text-stone-600", "Annulé"],
  };
  const [cls, label] = map[statut];
  return <span className={`text-xs font-semibold px-2 py-1 rounded ${cls}`}>{label}</span>;
}

function DonutChart({ pris, restant, size = 140 }) {
  const total = pris + restant || 1;
  const radius = size / 2 - 14;
  const circumference = 2 * Math.PI * radius;
  const prisRatio = pris / total;
  const prisLength = circumference * prisRatio;

  return (
    <div className="flex items-center gap-4">
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="#E7E5DF" strokeWidth="14" />
        <circle
          cx={size / 2}
          cy={size / 2}
          r={radius}
          fill="none"
          stroke="#5B4B8A"
          strokeWidth="14"
          strokeDasharray={`${prisLength} ${circumference}`}
          strokeLinecap="round"
          transform={`rotate(-90 ${size / 2} ${size / 2})`}
        />
        <text x={size / 2} y={size / 2 - 4} textAnchor="middle" className="fill-stone-900" style={{ fontSize: "22px", fontWeight: 700 }}>
          {restant}
        </text>
        <text x={size / 2} y={size / 2 + 16} textAnchor="middle" className="fill-stone-400" style={{ fontSize: "11px" }}>
          restants
        </text>
      </svg>
      <div className="text-sm">
        <div className="flex items-center gap-2 mb-1">
          <span className="w-3 h-3 rounded-full inline-block" style={{ backgroundColor: "#5B4B8A" }} />
          <span className="text-stone-600">Pris : <strong className="text-stone-900">{pris} j</strong></span>
        </div>
        <div className="flex items-center gap-2">
          <span className="w-3 h-3 rounded-full inline-block" style={{ backgroundColor: "#E7E5DF" }} />
          <span className="text-stone-600">Restants : <strong className="text-stone-900">{restant} j</strong></span>
        </div>
      </div>
    </div>
  );
}

function TeamBarChart({ users, joursPris }) {
  const employes = users.filter((u) => u.role !== "admin");
  const maxVal = Math.max(SOLDE_INITIAL, ...employes.map((u) => joursPris(u.id)), 1);
  const chartHeight = 160;

  return (
    <div className="flex items-end gap-6 h-[200px] pt-4">
      {employes.map((u) => {
        const pris = joursPris(u.id);
        const barHeight = Math.round((pris / maxVal) * chartHeight);
        return (
          <div key={u.id} className="flex flex-col items-center gap-2">
            <div className="relative flex items-end" style={{ height: chartHeight }}>
              <div
                className="w-10 rounded-t"
                style={{ height: `${Math.max(barHeight, 2)}px`, backgroundColor: "#5B4B8A" }}
                title={`${pris} jours pris`}
              />
            </div>
            <span className="text-xs font-semibold text-stone-700">{pris} j</span>
            <span className="text-xs text-stone-400 text-center max-w-[70px] truncate">{u.prenom}</span>
          </div>
        );
      })}
    </div>
  );
}

function LoginScreen({ users, onLogin }) {
  const [email, setEmail] = useState("");
  const [error, setError] = useState("");

  const submit = () => {
    const user = users.find((u) => u.email === email);
    if (!user) {
      setError("Email ou mot de passe incorrect");
      return;
    }
    onLogin(user);
  };

  return (
    <div className="min-h-screen flex items-center justify-center px-4">
      <div className="max-w-sm w-full bg-white p-8 rounded shadow-sm border border-stone-200">
        <h1 className="flex items-center gap-2 text-xl font-bold text-stone-900 mb-1">
          <Icon.Calendar className="w-5 h-5 text-indigo-600" />
          Gestion des Congés
        </h1>
        <p className="text-sm text-stone-500 mb-6">Institut Universitaire de la Côte</p>

        <label className="block text-sm font-medium text-stone-700 mb-1">Email</label>
        <div className="relative mb-3">
          <Icon.Mail className="w-4 h-4 text-stone-400 absolute left-3 top-1/2 -translate-y-1/2" />
          <input
            className="w-full border border-stone-300 rounded pl-9 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400"
            placeholder="admin@example.com ou nick@example.com"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submit()}
          />
        </div>
        {error && <p className="text-sm text-rose-600 mb-3">{error}</p>}
        <button onClick={submit} className="w-full flex items-center justify-center gap-2 bg-stone-900 text-white font-semibold py-2 rounded hover:bg-stone-800">
          <Icon.LogOut className="w-4 h-4 rotate-180" />
          Connexion
        </button>
        <p className="text-xs text-stone-400 mt-4">
          Démo : essaie admin@example.com (vue administrateur) ou nick@example.com (vue employé). Mot de passe non requis dans cette démo statique.
        </p>
      </div>
    </div>
  );
}

function RequestLeaveForm({ user, onSubmit }) {
  const [typeId, setTypeId] = useState(1);
  const [dateDebut, setDateDebut] = useState("");
  const [dateFin, setDateFin] = useState("");
  const [motif, setMotif] = useState("");
  const [error, setError] = useState("");
  const [success, setSuccess] = useState(false);

  const duree = dateDebut && dateFin ? calculerDuree(dateDebut, dateFin) : 0;

  const submit = (e) => {
    e.preventDefault();
    setError("");
    if (!dateDebut || !dateFin) {
      setError("Veuillez remplir tous les champs obligatoires");
      return;
    }
    if (new Date(dateFin) < new Date(dateDebut)) {
      setError("La date de fin doit être postérieure à la date de début");
      return;
    }
    if (duree > user.solde_conges) {
      setError("Vous n'avez pas assez de jours de congés disponibles");
      return;
    }
    onSubmit({ type_conge_id: Number(typeId), date_debut: dateDebut, date_fin: dateFin, duree, motif });
    setSuccess(true);
  };

  if (success) {
    return (
      <div className="bg-emerald-50 border border-emerald-200 text-emerald-800 rounded p-4">
        Votre demande de congé a été soumise avec succès et est en attente d'approbation.
      </div>
    );
  }

  return (
    <form onSubmit={submit} className="bg-white p-6 rounded border border-stone-200 space-y-4">
      <div className="grid grid-cols-2 gap-4">
        <div>
          <label className="block text-sm font-medium text-stone-700 mb-1">Type de congé</label>
          <select value={typeId} onChange={(e) => setTypeId(e.target.value)} className="w-full border border-stone-300 rounded px-3 py-2">
            {TYPES_CONGES.map((t) => <option key={t.id} value={t.id}>{t.nom}</option>)}
          </select>
        </div>
        <div>
          <label className="block text-sm font-medium text-stone-700 mb-1">Solde disponible</label>
          <input readOnly value={`${user.solde_conges} jours`} className="w-full border border-stone-200 bg-stone-50 rounded px-3 py-2 text-stone-500" />
        </div>
      </div>
      <div className="grid grid-cols-2 gap-4">
        <div>
          <label className="block text-sm font-medium text-stone-700 mb-1">Date de début</label>
          <input type="date" value={dateDebut} onChange={(e) => setDateDebut(e.target.value)} className="w-full border border-stone-300 rounded px-3 py-2" />
        </div>
        <div>
          <label className="block text-sm font-medium text-stone-700 mb-1">Date de fin</label>
          <input type="date" value={dateFin} onChange={(e) => setDateFin(e.target.value)} className="w-full border border-stone-300 rounded px-3 py-2" />
        </div>
      </div>
      <div>
        <label className="block text-sm font-medium text-stone-700 mb-1">Durée calculée</label>
        <input readOnly value={`${duree} jour(s)`} className="w-full border border-stone-200 bg-stone-50 rounded px-3 py-2 text-stone-500" />
      </div>
      <div>
        <label className="block text-sm font-medium text-stone-700 mb-1">Motif (optionnel)</label>
        <textarea value={motif} onChange={(e) => setMotif(e.target.value)} rows="3" className="w-full border border-stone-300 rounded px-3 py-2" />
      </div>
      {error && <p className="text-sm text-rose-600">{error}</p>}
      <button type="submit" className="flex items-center gap-2 bg-indigo-600 text-white font-semibold px-4 py-2 rounded hover:bg-indigo-700">
        <Icon.Check className="w-4 h-4" />
        Soumettre la demande
      </button>
    </form>
  );
}

function EmployeeView({ user, demandes, onSubmitRequest, onCancel }) {
  const [tab, setTab] = useState("dashboard");
  const mesDemandes = demandes.filter((d) => d.utilisateur_id === user.id);
  const stats = {
    approuvees: mesDemandes.filter((d) => d.statut === "approuvé").length,
    en_attente: mesDemandes.filter((d) => d.statut === "en_attente").length,
    refusees: mesDemandes.filter((d) => d.statut === "refusé").length,
  };

  return (
    <div className="max-w-4xl mx-auto px-6 py-8">
      <div className="flex gap-2 mb-6 border-b border-stone-200">
        {[
          ["dashboard", "Tableau de bord", Icon.Dashboard],
          ["nouvelle", "Nouvelle demande", Icon.Plus],
          ["mes-demandes", "Mes demandes", Icon.List],
        ].map(([key, label, Ico]) => (
          <button
            key={key}
            onClick={() => setTab(key)}
            className={`flex items-center gap-2 px-4 py-2 text-sm font-medium border-b-2 -mb-px ${tab === key ? "border-indigo-600 text-indigo-600" : "border-transparent text-stone-500"}`}
          >
            <Ico className="w-4 h-4" />
            {label}
          </button>
        ))}
      </div>

      {tab === "dashboard" && (
        <div>
          <div className="grid grid-cols-3 gap-4 mb-6">
            <div className="bg-white border border-stone-200 rounded p-4 text-center">
              <Icon.Calendar className="w-5 h-5 mx-auto mb-2 text-indigo-500" />
              <p className="text-sm text-stone-500 mb-1">Solde de congés</p>
              <p className="text-3xl font-bold text-indigo-600">{user.solde_conges}</p>
              <p className="text-xs text-stone-400">jours disponibles</p>
            </div>
            <div className="bg-white border border-stone-200 rounded p-4 text-center">
              <Icon.Check className="w-5 h-5 mx-auto mb-2 text-emerald-500" />
              <p className="text-sm text-stone-500 mb-1">Approuvées</p>
              <p className="text-3xl font-bold text-emerald-600">{stats.approuvees}</p>
            </div>
            <div className="bg-white border border-stone-200 rounded p-4 text-center">
              <Icon.Clock className="w-5 h-5 mx-auto mb-2 text-amber-500" />
              <p className="text-sm text-stone-500 mb-1">En attente</p>
              <p className="text-3xl font-bold text-amber-600">{stats.en_attente}</p>
            </div>
          </div>

          <div className="bg-white border border-stone-200 rounded p-6 mb-6">
            <p className="flex items-center gap-2 font-semibold text-stone-800 text-sm mb-4">
              <Icon.PieChart className="w-4 h-4 text-stone-500" />
              Répartition de mes congés
            </p>
            <DonutChart pris={Math.max(0, SOLDE_INITIAL - user.solde_conges)} restant={user.solde_conges} />
          </div>

          <button onClick={() => setTab("nouvelle")} className="flex items-center gap-2 bg-indigo-600 text-white font-semibold px-4 py-2 rounded hover:bg-indigo-700">
            <Icon.Plus className="w-4 h-4" />
            Demander un congé
          </button>
        </div>
      )}

      {tab === "nouvelle" && <RequestLeaveForm user={user} onSubmit={(d) => onSubmitRequest(user.id, d)} />}

      {tab === "mes-demandes" && (
        <div className="bg-white border border-stone-200 rounded overflow-hidden">
          <table className="w-full text-sm">
            <thead className="bg-stone-50 text-stone-500">
              <tr>
                <th className="text-left px-4 py-2">Type</th>
                <th className="text-left px-4 py-2">Période</th>
                <th className="text-left px-4 py-2">Durée</th>
                <th className="text-left px-4 py-2">Statut</th>
                <th className="text-left px-4 py-2">Action</th>
              </tr>
            </thead>
            <tbody>
              {mesDemandes.map((d) => (
                <tr key={d.id} className="border-t border-stone-100">
                  <td className="px-4 py-2">{typeNom(d.type_conge_id)}</td>
                  <td className="px-4 py-2">{d.date_debut} → {d.date_fin}</td>
                  <td className="px-4 py-2">{d.duree} j</td>
                  <td className="px-4 py-2"><StatutBadge statut={d.statut} /></td>
                  <td className="px-4 py-2">
                    {d.statut === "en_attente" && (
                      <button onClick={() => onCancel(d.id)} className="flex items-center gap-1 text-rose-600 text-xs font-medium hover:underline">
                        <Icon.X className="w-3 h-3" />
                        Annuler
                      </button>
                    )}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function UserBalanceRow({ user, onUpdate }) {
  const [value, setValue] = useState(user.solde_conges);
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    setValue(user.solde_conges);
  }, [user.solde_conges]);

  const save = () => {
    const num = Number(value);
    if (Number.isNaN(num) || num < 0) return;
    onUpdate(user.id, num);
    setSaved(true);
    setTimeout(() => setSaved(false), 1200);
  };

  return (
    <tr className="border-t border-stone-100">
      <td className="px-4 py-2">{user.prenom} {user.nom}</td>
      <td className="px-4 py-2 text-stone-500">{user.email}</td>
      <td className="px-4 py-2">
        <span className={`text-xs font-semibold px-2 py-0.5 rounded ${user.role === "admin" ? "bg-indigo-100 text-indigo-700" : "bg-stone-100 text-stone-600"}`}>
          {user.role === "admin" ? "Administrateur" : "Employé"}
        </span>
      </td>
      <td className="px-4 py-2">
        <div className="flex items-center gap-2">
          <input
            type="number"
            min="0"
            step="0.5"
            value={value}
            onChange={(e) => setValue(e.target.value)}
            className="w-20 border border-stone-300 rounded px-2 py-1 text-sm"
          />
          <button onClick={save} className="flex items-center gap-1 text-indigo-600 text-xs font-semibold hover:underline">
            <Icon.Edit className="w-3 h-3" />
            Enregistrer
          </button>
          {saved && <span className="flex items-center gap-1 text-xs text-emerald-600"><Icon.Check className="w-3 h-3" />Mis à jour</span>}
        </div>
      </td>
    </tr>
  );
}

function CreateUserForm({ existingEmails, onCreate }) {
  const [nom, setNom] = useState("");
  const [prenom, setPrenom] = useState("");
  const [email, setEmail] = useState("");
  const [role, setRole] = useState("employe");
  const [soldeInitial, setSoldeInitial] = useState(25);
  const [error, setError] = useState("");
  const [success, setSuccess] = useState(false);

  const submit = (e) => {
    e.preventDefault();
    setError("");
    if (!nom.trim() || !prenom.trim() || !email.trim()) {
      setError("Veuillez remplir tous les champs obligatoires");
      return;
    }
    if (existingEmails.includes(email.trim().toLowerCase())) {
      setError("Cet email est déjà utilisé");
      return;
    }
    onCreate({ nom: nom.trim(), prenom: prenom.trim(), email: email.trim(), role, solde_conges: Number(soldeInitial) });
    setNom(""); setPrenom(""); setEmail(""); setRole("employe"); setSoldeInitial(25);
    setSuccess(true);
    setTimeout(() => setSuccess(false), 2000);
  };

  return (
    <div className="bg-white border border-stone-200 rounded p-6 max-w-lg">
      <p className="flex items-center gap-2 font-semibold text-stone-800 text-sm mb-4">
        <Icon.UserPlus className="w-4 h-4 text-stone-500" />
        Créer un compte employé
      </p>
      <form onSubmit={submit} className="space-y-4">
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="block text-sm font-medium text-stone-700 mb-1">Prénom</label>
            <input value={prenom} onChange={(e) => setPrenom(e.target.value)} className="w-full border border-stone-300 rounded px-3 py-2" />
          </div>
          <div>
            <label className="block text-sm font-medium text-stone-700 mb-1">Nom</label>
            <input value={nom} onChange={(e) => setNom(e.target.value)} className="w-full border border-stone-300 rounded px-3 py-2" />
          </div>
        </div>
        <div>
          <label className="block text-sm font-medium text-stone-700 mb-1">Email</label>
          <input type="email" value={email} onChange={(e) => setEmail(e.target.value)} className="w-full border border-stone-300 rounded px-3 py-2" />
        </div>
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="block text-sm font-medium text-stone-700 mb-1">Rôle</label>
            <select value={role} onChange={(e) => setRole(e.target.value)} className="w-full border border-stone-300 rounded px-3 py-2">
              <option value="employe">Employé</option>
              <option value="admin">Administrateur</option>
            </select>
          </div>
          <div>
            <label className="block text-sm font-medium text-stone-700 mb-1">Solde initial</label>
            <input type="number" min="0" step="0.5" value={soldeInitial} onChange={(e) => setSoldeInitial(e.target.value)} className="w-full border border-stone-300 rounded px-3 py-2" />
          </div>
        </div>
        {error && <p className="text-sm text-rose-600">{error}</p>}
        {success && <p className="flex items-center gap-1 text-sm text-emerald-600"><Icon.Check className="w-4 h-4" />Utilisateur créé avec succès.</p>}
        <button type="submit" className="flex items-center gap-2 bg-indigo-600 text-white font-semibold px-4 py-2 rounded hover:bg-indigo-700">
          <Icon.UserPlus className="w-4 h-4" />
          Créer le compte
        </button>
      </form>
      <p className="text-xs text-stone-400 mt-4">
        Démo : pas de mot de passe requis, la connexion se fait par email uniquement dans cette version statique.
      </p>
    </div>
  );
}

function ManageUsers({ users, onUpdateBalance }) {
  return (
    <div className="bg-white border border-stone-200 rounded overflow-hidden">
      <div className="flex items-center gap-2 px-4 py-3 border-b border-stone-200 font-semibold text-stone-800 text-sm">
        <Icon.Users className="w-4 h-4 text-stone-500" />
        Gérer les utilisateurs
      </div>
      <table className="w-full text-sm">
        <thead className="bg-stone-50 text-stone-500">
          <tr>
            <th className="text-left px-4 py-2">Nom</th>
            <th className="text-left px-4 py-2">Email</th>
            <th className="text-left px-4 py-2">Rôle</th>
            <th className="text-left px-4 py-2">Solde de congés</th>
          </tr>
        </thead>
        <tbody>
          {users.map((u) => (
            <UserBalanceRow key={u.id} user={u} onUpdate={onUpdateBalance} />
          ))}
        </tbody>
      </table>
    </div>
  );
}

function AdminView({ users, demandes, currentUser, onDecision, onUpdateBalance, onCreateUser, onSubmitOwnRequest }) {
  const [tab, setTab] = useState("demandes");
  const [showAdminRequest, setShowAdminRequest] = useState(false);
  const pending = demandes.filter((d) => d.statut === "en_attente");
  const stats = {
    total: demandes.length,
    approuvees: demandes.filter((d) => d.statut === "approuvé").length,
    en_attente: pending.length,
    refusees: demandes.filter((d) => d.statut === "refusé").length,
  };
  const lowBalance = [...users].filter((u) => u.role !== "admin").sort((a, b) => a.solde_conges - b.solde_conges).slice(0, 5);

  const nomUser = (id) => {
    const u = users.find((u) => u.id === id);
    return u ? `${u.prenom} ${u.nom}` : "?";
  };

  const joursPris = (userId) => {
    const u = users.find((u) => u.id === userId);
    if (!u) return 0;
    return Math.max(0, SOLDE_INITIAL - u.solde_conges);
  };

  const tabs = [
    ["demandes", "Demandes", Icon.List],
    ["mon-solde", "Mon solde", Icon.PieChart],
    ["utilisateurs", "Gérer les utilisateurs", Icon.Users],
    ["creer", "Créer un compte", Icon.UserPlus],
  ];

  return (
    <div className="max-w-5xl mx-auto px-6 py-8">
      <div className="flex gap-2 mb-6 border-b border-stone-200 flex-wrap">
        {tabs.map(([key, label, Ico]) => (
          <button
            key={key}
            onClick={() => setTab(key)}
            className={`flex items-center gap-2 px-4 py-2 text-sm font-medium border-b-2 -mb-px ${tab === key ? "border-indigo-600 text-indigo-600" : "border-transparent text-stone-500"}`}
          >
            <Ico className="w-4 h-4" />
            {label}
          </button>
        ))}
      </div>

      {tab === "demandes" && (
        <div>
          <div className="grid grid-cols-4 gap-4 mb-6">
            {[["Total", stats.total, "text-stone-900"], ["Approuvées", stats.approuvees, "text-emerald-600"], ["En attente", stats.en_attente, "text-amber-600"], ["Refusées", stats.refusees, "text-rose-600"]].map(([label, val, cls]) => (
              <div key={label} className="bg-white border border-stone-200 rounded p-4 text-center">
                <p className="text-sm text-stone-500 mb-1">{label}</p>
                <p className={`text-3xl font-bold ${cls}`}>{val}</p>
              </div>
            ))}
          </div>

          <div className="grid grid-cols-3 gap-6 mb-6">
            <div className="col-span-2 bg-white border border-stone-200 rounded overflow-hidden">
              <div className="flex items-center gap-2 px-4 py-3 border-b border-stone-200 font-semibold text-stone-800 text-sm">
                <Icon.List className="w-4 h-4 text-stone-500" />
                Demandes en attente
              </div>
              {pending.length === 0 ? (
                <p className="p-4 text-sm text-stone-400">Aucune demande en attente.</p>
              ) : (
                <table className="w-full text-sm">
                  <thead className="bg-stone-50 text-stone-500">
                    <tr>
                      <th className="text-left px-4 py-2">Employé</th>
                      <th className="text-left px-4 py-2">Type</th>
                      <th className="text-left px-4 py-2">Période</th>
                      <th className="text-left px-4 py-2">Actions</th>
                    </tr>
                  </thead>
                  <tbody>
                    {pending.map((d) => (
                      <tr key={d.id} className="border-t border-stone-100">
                        <td className="px-4 py-2">{nomUser(d.utilisateur_id)}</td>
                        <td className="px-4 py-2">{typeNom(d.type_conge_id)}</td>
                        <td className="px-4 py-2">{d.date_debut} → {d.date_fin} ({d.duree} j)</td>
                        <td className="px-4 py-2 space-x-3">
                          <button onClick={() => onDecision(d.id, "approuvé")} className="inline-flex items-center gap-1 text-emerald-600 text-xs font-semibold hover:underline">
                            <Icon.Check className="w-3 h-3" />
                            Approuver
                          </button>
                          <button onClick={() => {
                            const motif = prompt("Motif du refus :");
                            if (motif) onDecision(d.id, "refusé", motif);
                          }} className="inline-flex items-center gap-1 text-rose-600 text-xs font-semibold hover:underline">
                            <Icon.X className="w-3 h-3" />
                            Refuser
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>

            <div className="bg-white border border-stone-200 rounded p-4">
              <p className="flex items-center gap-2 font-semibold text-stone-800 text-sm mb-3">
                <Icon.AlertTriangle className="w-4 h-4 text-amber-500" />
                Soldes faibles
              </p>
              <div className="space-y-2">
                {lowBalance.map((u) => (
                  <div key={u.id} className="flex justify-between items-center text-sm">
                    <span className="text-stone-700">{u.prenom} {u.nom}</span>
                    <span className={`text-xs font-semibold px-2 py-0.5 rounded ${u.solde_conges < 5 ? "bg-rose-100 text-rose-700" : "bg-amber-100 text-amber-700"}`}>
                      {u.solde_conges} j
                    </span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="bg-white border border-stone-200 rounded p-6">
            <p className="flex items-center gap-2 font-semibold text-stone-800 text-sm mb-1">
              <Icon.BarChart className="w-4 h-4 text-stone-500" />
              Jours de congés pris par employé
            </p>
            <p className="text-xs text-stone-400 mb-2">Base de comparaison : {SOLDE_INITIAL} jours par employé</p>
            <TeamBarChart users={users} joursPris={joursPris} />
          </div>
        </div>
      )}

      {tab === "mon-solde" && (
        <div className="max-w-lg space-y-6">
          <div className="bg-white border border-stone-200 rounded p-6">
            <p className="flex items-center gap-2 font-semibold text-stone-800 text-sm mb-4">
              <Icon.PieChart className="w-4 h-4 text-stone-500" />
              Mon solde de congés
            </p>
            <DonutChart pris={Math.max(0, SOLDE_INITIAL - currentUser.solde_conges)} restant={currentUser.solde_conges} />
          </div>

          {showAdminRequest ? (
            <div>
              <RequestLeaveForm
                user={currentUser}
                onSubmit={(d) => {
                  onSubmitOwnRequest(currentUser.id, d);
                }}
              />
              <button onClick={() => setShowAdminRequest(false)} className="mt-3 text-sm text-stone-500 hover:underline">
                Retour
              </button>
            </div>
          ) : (
            <button
              onClick={() => setShowAdminRequest(true)}
              className="flex items-center gap-2 bg-indigo-600 text-white font-semibold px-4 py-2 rounded hover:bg-indigo-700"
            >
              <Icon.Plus className="w-4 h-4" />
              Demander un congé
            </button>
          )}
        </div>
      )}

      {tab === "utilisateurs" && <ManageUsers users={users} onUpdateBalance={onUpdateBalance} />}

      {tab === "creer" && (
        <CreateUserForm existingEmails={users.map((u) => u.email.toLowerCase())} onCreate={onCreateUser} />
      )}
    </div>
  );
}

function App() {
  const [db, setDb] = useState(loadDB);
  const [session, setSession] = useState(null);

  useEffect(() => saveDB(db), [db]);

  const handleLogin = (user) => setSession(user);
  const handleLogout = () => setSession(null);

  const handleSubmitRequest = (userId, data) => {
    setDb((prev) => {
      const newId = Math.max(0, ...prev.demandes.map((d) => d.id)) + 1;
      const demande = {
        id: newId,
        utilisateur_id: userId,
        ...data,
        statut: "en_attente",
        commentaire: "",
        date_demande: new Date().toISOString().slice(0, 10),
      };
      return { ...prev, demandes: [...prev.demandes, demande] };
    });
  };

  const handleCancel = (demandeId) => {
    setDb((prev) => ({
      ...prev,
      demandes: prev.demandes.map((d) => (d.id === demandeId ? { ...d, statut: "annulé" } : d)),
    }));
  };

  const handleDecision = (demandeId, statut, commentaire = "") => {
    setDb((prev) => {
      const demande = prev.demandes.find((d) => d.id === demandeId);
      let users = prev.users;
      if (statut === "approuvé") {
        users = prev.users.map((u) =>
          u.id === demande.utilisateur_id ? { ...u, solde_conges: u.solde_conges - demande.duree } : u
        );
      }
      const demandes = prev.demandes.map((d) => (d.id === demandeId ? { ...d, statut, commentaire } : d));
      return { users, demandes };
    });
  };

  const handleUpdateBalance = (userId, newBalance) => {
    setDb((prev) => ({
      ...prev,
      users: prev.users.map((u) => (u.id === userId ? { ...u, solde_conges: newBalance } : u)),
    }));
  };

  const handleCreateUser = (data) => {
    setDb((prev) => {
      const newId = Math.max(0, ...prev.users.map((u) => u.id)) + 1;
      return { ...prev, users: [...prev.users, { id: newId, ...data }] };
    });
  };

  if (!session) return <LoginScreen users={db.users} onLogin={handleLogin} />;

  const liveUser = db.users.find((u) => u.id === session.id) || session;

  return (
    <div className="min-h-screen">
      <header className="bg-white border-b border-stone-200 px-6 py-4 flex justify-between items-center">
        <h1 className="flex items-center gap-2 font-bold text-stone-900">
          <Icon.Calendar className="w-5 h-5 text-indigo-600" />
          Gestion des Congés
        </h1>
        <div className="flex items-center gap-3 text-sm">
          <span className="flex items-center gap-1 text-stone-600">
            {liveUser.role === "admin" ? <Icon.Shield className="w-4 h-4 text-stone-400" /> : <Icon.Mail className="w-4 h-4 text-stone-400" />}
            {liveUser.prenom} {liveUser.nom} · {liveUser.role === "admin" ? "Administrateur" : "Employé"}
          </span>
          <button onClick={handleLogout} className="flex items-center gap-1 text-indigo-600 font-medium hover:underline">
            <Icon.LogOut className="w-4 h-4" />
            Déconnexion
          </button>
        </div>
      </header>
      {liveUser.role === "admin" ? (
        <AdminView
          users={db.users}
          demandes={db.demandes}
          currentUser={liveUser}
          onDecision={handleDecision}
          onUpdateBalance={handleUpdateBalance}
          onCreateUser={handleCreateUser}
          onSubmitOwnRequest={handleSubmitRequest}
        />
      ) : (
        <EmployeeView user={liveUser} demandes={db.demandes} onSubmitRequest={handleSubmitRequest} onCancel={handleCancel} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
